<script type = "text/javascript">
function checkName() {
  // from ifElse.html
  lblOutput = document.getElementById("lblOutput");
  txtInput = document.getElementById("txtInput");

  userName = txtInput.value;
  if (userName == "Coil Snake") {
    lblOutput.innerHTML = "<b>Coil Snake</b> <br> HP: 18 <br> Offense: 3 <br> Defense: 4 <br> Speed: 2 <br> exp: 1";

    lblOutput.innerHTML = "<b>Spiteful Crow</b> <br> HP: 24 <br> Offense: 5 <br> Defense: 3 <br> Speed: 77 <br> exp: 3";
  } else if (userName == "Runaway Dog") {
    lblOutput.innerHTML = "<b>Runaway Dog</b> <br> HP: 21 <br> Offense: 4 <br> Defense: 5 <br> Speed: 26 <br> exp: 4";
  } else if (userName == "Pogo Punk") {
    lblOutput.innerHTML = "<b>Pogo Punk</b> <br> HP: 35 <br> Offense: 8 <br> Defense: 10 <br> Speed: 3 <br> exp: 15";
  } else if (userName == "Skate Punk") {
    lblOutput.innerHTML = "<b>Skate Punk</b> <br> HP: 31 <br> Offense: 7 <br> Defense: 8 <br> Speed: 5 <br> exp: 12";
  } else if (userName == "Yes Man Junior") {
    lblOutput.innerHTML = "<b>Yes Man Junior</b> <br> HP: 33 <br> Offense: 8 <br> Defense: 9 <br> Speed: 4 <br> exp: 13";
  } else {
    lblOutput.innerHTML = "Hey there, buddy!";
  } // end if
} // end function
</script>
